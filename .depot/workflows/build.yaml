# Depot CI Migration
# Source: .github/workflows/build.yaml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Build and Publish
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to validate and publish, for example v0.10.3"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Resolve validation inputs from build.yaml
        id: cfg
        run: |
          just _prepare
          {
            echo "alpine=$(yq -r '.versions.alpine' build.yaml)"
            echo "trivy=$(yq -r '.versions.trivy' build.yaml)"
            echo "busybox=$(yq -r '.versions.busybox' build.yaml)"
            echo "go=$(yq -r '.versions.go' build.yaml)"
            echo "acfs=$(yq -r '.versions.acfs' build.yaml)"
            echo "platform=$(yq -r '.platforms.validate' build.yaml)"
            echo "tag=$(yq -r '.image.ci_tag' build.yaml)"
          } >> "$GITHUB_OUTPUT"
      - name: Build validation image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: np622krb2x
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.cfg.outputs.platform }}
          load: true
          push: false
          tags: ${{ steps.cfg.outputs.tag }}
          build-args: |
            ALPINE_VERSION=${{ steps.cfg.outputs.alpine }}
            TRIVY_VERSION=${{ steps.cfg.outputs.trivy }}
            BUSYBOX_VERSION=${{ steps.cfg.outputs.busybox }}
            GO_VERSION=${{ steps.cfg.outputs.go }}
            ACFS_VERSION=${{ steps.cfg.outputs.acfs }}
      - name: Validate runtime contract
        run: just test "${{ steps.cfg.outputs.tag }}"
  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: validate
    runs-on: depot-ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Resolve build inputs from build.yaml
        id: cfg
        run: |
          just _prepare
          {
            echo "alpine=$(yq -r '.versions.alpine' build.yaml)"
            echo "trivy=$(yq -r '.versions.trivy' build.yaml)"
            echo "busybox=$(yq -r '.versions.busybox' build.yaml)"
            echo "go=$(yq -r '.versions.go' build.yaml)"
            echo "acfs=$(yq -r '.versions.acfs' build.yaml)"
            echo "platforms=$(yq -r '.platforms.publish | join(",")' build.yaml)"
            echo "images<<EOF"
            yq -r '.image.targets | .[]' build.yaml
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to container registries
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry-auth: |
            - registry: ghcr.io
              username: getarcaneappbot
              password: ${{ secrets.ARCANE_BOT_TOKEN }}
            - registry: docker.io
              username: ${{ secrets.DOCKER_USER }}
              password: ${{ secrets.DOCKER_PAT }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.cfg.outputs.images }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag || github.ref_name }}
            type=sha
      - name: Build and publish image
        id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: np622krb2x
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: true
          build-args: |
            ALPINE_VERSION=${{ steps.cfg.outputs.alpine }}
            TRIVY_VERSION=${{ steps.cfg.outputs.trivy }}
            BUSYBOX_VERSION=${{ steps.cfg.outputs.busybox }}
            GO_VERSION=${{ steps.cfg.outputs.go }}
            ACFS_VERSION=${{ steps.cfg.outputs.acfs }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Sign published image
        env:
          IMAGES: ${{ steps.cfg.outputs.images }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for image in ${IMAGES}; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${image}@${{ steps.build.outputs.digest }}"
          done

      - name: Record published digest
        run: |
          {
            echo "Published images: $(printf '%s ' ${{ steps.cfg.outputs.images }})"
            echo "Published platforms: ${{ steps.cfg.outputs.platforms }}"
            echo "Published digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
